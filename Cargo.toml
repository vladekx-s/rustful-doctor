[package]
name = "rustful_doctor"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }
chrono = "0.4.45"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version="1.26.1", features=["v4"] }
sqlx = { version = "0.9.0", features = [
    "runtime-tokio", 
    "postgres", 
    "tls-rustls", 
    "uuid",
    "chrono",
    "migrate",
    "macros"] }
sqlx-cli = "0.9.0"
